plugins {
    id 'stairway.library-conventions'
}

configurations.all {
    resolutionStrategy {
        force 'com.google.guava:guava:33.4.8-jre'
    }
}

dependencies {
    api project(':stairway')

    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.20.0'

    // Google dependencies
    implementation platform('com.google.cloud:libraries-bom:26.72.0') // use common bom
    implementation group: 'com.google.cloud', name: 'google-cloud-pubsub'
}

apply from: "$rootDir/gradle/test.gradle"
